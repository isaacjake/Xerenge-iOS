
name: Build Xerenge iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja pkgconf

      - name: Initialize repository submodules
        run: |
          git submodule update --init --recursive

      - name: Download game image
        env:
          GAME_URL: ${{ secrets.Game_URL }}
        run: |
          curl -L --fail "$GAME_URL" -o game.iso

      - name: Build extraction tools
        run: |
          chmod +x scripts/build-tools.sh
          bash scripts/build-tools.sh

      - name: Extract game image
        run: |
          ./scripts/extract-image \
            --sha256 34c1bd4d549c2c53f29d814fa5e5d1c04c533c5ca0c39e57b6c2538f44ff59b4 \
            --sha256 7abf689f52b70666ba92052bd157cfcae9ed6290dae298fbf639baa1d169f92b \
            game.iso game

      - name: Patch SDK setup script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          setup = Path("scripts/setup-sdk.sh")
          text = setup.read_text()

          marker = 'echo "== building the SDK"\ncmake --preset'
          patch = '''echo "== patching Vulkan Loader CMake condition"
          python3 - "$sdk/thirdparty/vulkan-loader/loader/CMakeLists.txt" <<'PATCH'
          from pathlib import Path
          import sys

          file = Path(sys.argv[1])
          text = file.read_text()
          old = 'if(WIN32 AND ${SYSTEM_PROCESSOR} MATCHES "arm64")'
          new = 'if(WIN32 AND "${SYSTEM_PROCESSOR}" MATCHES "arm64")'

          if old in text:
              text = text.replace(old, new)
              file.write_text(text)
              print("Vulkan Loader condition patched")
          elif new in text:
              print("Vulkan Loader condition already patched")
          else:
              raise SystemExit("Vulkan Loader condition not found")
          PATCH

          echo "== building the SDK"
          cmake --preset'''

          if marker not in text:
              raise SystemExit("Could not find SDK build marker")

          setup.write_text(text.replace(marker, patch))
          print("Inserted Vulkan Loader patch into setup-sdk.sh")
          PY

      - name: Build Xerenge SDK
        run: |
          bash scripts/setup-sdk.sh

      - name: Build renderer and shader tools
        run: |
          bash scripts/setup-deps.sh

      - name: Generate game code and shaders
        run: |
          bash scripts/build.sh --game game --generate-only

      - name: Patch MoltenVK for iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = list(Path("rexglue-sdk").rglob("Common/CMakeLists.txt"))
          if not candidates:
              candidates = list(Path("rexglue").rglob("Common/CMakeLists.txt"))

          for file in candidates:
              text = file.read_text()

              text = re.sub(
                  r'find_library\(APPKIT_LIBRARY AppKit REQUIRED\)',
                  'if(NOT IOS)\n'
                  '  find_library(APPKIT_LIBRARY AppKit REQUIRED)\n'
                  'endif()',
                  text
              )

              text = re.sub(
                  r'find_library\(IOKIT_LIBRARY IOKit REQUIRED\)',
                  'if(NOT IOS)\n'
                  '  find_library(IOKIT_LIBRARY IOKit REQUIRED)\n'
                  'endif()',
                  text
              )

              text = text.replace(
                  '${APPKIT_LIBRARY}',
                  '$<$<NOT:$<BOOL:${IOS}>>:${APPKIT_LIBRARY}>'
              )

              text = text.replace(
                  '${IOKIT_LIBRARY}',
                  '$<$<NOT:$<BOOL:${IOS}>>:${IOKIT_LIBRARY}>'
              )

              file.write_text(text)
              print(f"Patched {file}")
          PY

      - name: Generate iOS Xcode project
        run: |
          cmake -S rexglue \
            -B rexglue/build-ios \
            -G Xcode \
            -DREXSDK_DIR="$GITHUB_WORKSPACE/rexglue-sdk" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DIOS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build iPhone app
        run: |
          cmake --build rexglue/build-ios \
            --config Release \
            --target burnout \
            --verbose \
            -- CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGN_IDENTITY=""

      - name: Locate iOS app
        run: |
          find rexglue/build-ios -name "burnout.app" -print

      - name: Package IPA
        run: |
          APP=$(find rexglue/build-ios \
            -path "*/Release-iphoneos/burnout.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: burnout.app not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Burnout-Revenge.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Burnout-Revenge-iOS-IPA
          path: Burnout-Revenge.ipa
          if-no-files-found: error
